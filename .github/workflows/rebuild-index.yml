name: Rebuild README + cheatsheet

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '!README.md'
      - '!cheatsheet.md'
      - 'scripts/build_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild index and cheatsheet
        run: python scripts/build_index.py .

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md cheatsheet.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild index"
            git push
          else
            echo "No index changes."
          fi
